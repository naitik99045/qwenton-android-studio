name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Verify APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file was generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -lh "$APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwenton-studio-apex-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 90
          if-no-files-found: error

      - name: Summary Report
        run: |
          echo "### 🚀 APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "Your Android APK has been compiled and is ready for installation." >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name:** \`com.qwenton.studio.apex\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** Android 10 to Android 15 (ARM64-v8a)" >> $GITHUB_STEP_SUMMARY
          echo "- **Download Artifact:** Download \`qwenton-studio-apex-debug-apk\` from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
