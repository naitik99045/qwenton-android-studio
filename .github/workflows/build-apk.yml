name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache & Toolchain
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Debug APK
        id: build_step
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log
        continue-on-error: true

      - name: Locate and Verify APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file was generated!"
            echo "### ❌ Gradle Build Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-build-log
            cp gradle-build.log build-failure.log 2>/dev/null || true
            git add build-failure.log
            git commit -m "ci: upload build failure log [skip ci]" || true
            git push -f origin ci-build-log || true

            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -lh "$APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwenton-studio-apex-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 90
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Qwenton Studio Apex v1.0.0 Debug APK"
          body: |
            ### 🚀 Qwenton Studio Apex Android APK
            Automated debug APK build from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.
            
            - **Package Name**: `com.qwenton.studio.apex`
            - **Target**: Android 10 to Android 15 (API 29-35, ARM64-v8a)
            - **Installation**: Download `app-debug.apk` directly below to your Android device and tap to install.
          files: ${{ steps.locate_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary Report
        run: |
          echo "### 🚀 APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "Your Android APK has been compiled and is ready for installation." >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name:** \`com.qwenton.studio.apex\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** Android 10 to Android 15 (ARM64-v8a)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download:** Available directly from [Releases](https://github.com/${{ github.repository }}/releases) or the Artifacts section above." >> $GITHUB_STEP_SUMMARY
